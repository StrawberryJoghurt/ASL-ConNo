id: TIMIT-gender-16k
_target_: autrainer.datasets.TIMIT

path: /Users/yiyi_mac/autrainer_run/demo/data/TIMIT-gender
features_subdir: log_mel_16k
index_column: path
target_column: gender
file_type: npy
file_handler: autrainer.datasets.utils.NumpyFileHandler
task_type: gender

criterion:
  _target_: autrainer.criterions.AutoCrossEntropyLoss
  mode: ${criterion.mode}
  noise_level: ${criterion.noise_level}
  
metrics:
  - autrainer.metrics.Accuracy
  - autrainer.metrics.UAR
  - autrainer.metrics.F1
tracking_metric: autrainer.metrics.Accuracy

transform:
  type: grayscale
  base:
    - autrainer.transforms.Expand:
        size: 779
        axis: -2