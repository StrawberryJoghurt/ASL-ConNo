defaults:
  - _autrainer_
  - _self_

trainer:
  accelerator: gpu        # or 'cuda'
  devices: [4, 5]         # 指定 GPU 号列表
  strategy: ddp           # 分布式策略 (可选)

results_dir: results
experiment_id: default
iterations: 10

hydra:
  sweeper:
    params:
      +seed: 1
      +batch_size: 32
      +learning_rate: 0.001
      dataset: SpeechCommands-16k
      model: Cnn10-32k-T
      optimizer: Adam