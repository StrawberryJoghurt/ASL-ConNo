defaults:
  - _autrainer_
  - _self_

device: "cuda:7"        # or 'cuda'

results_dir: results
experiment_id: default
iterations: 10

hydra:
  sweeper:
    params:
      +seed: 0
      +batch_size: 32
      +learning_rate: 0.001
      dataset: TIMIT-sentencetype-16k
      model: Cnn10-32k-T
      optimizer: Adam
    