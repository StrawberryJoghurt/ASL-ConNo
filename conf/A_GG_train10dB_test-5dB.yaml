defaults:
- _autrainer_
- _self_
device: cuda
results_dir: results/run_02
experiment_id: GG_train10_test-5
iterations: 0
hydra:
  sweeper:
    params:
      +seed: 0
      +batch_size: 64
      +learning_rate: 0.001
      dataset: TIMIT-sentencetype-16k
      model: Cnn10-32k-T
      +model.model_checkpoint: trained_models/audioset_run_02/GG_10dB.pt
      +model.skip_last_layer: false
      optimizer: Adam
train_augmentation:
  _target_: autrainer.augmentations.augmentation_pipeline.AugmentationPipeline
  id: GaussianNoise(10dB)
  pipeline:
  - SNR_noise:
      _target_: autrainer.augmentations.spectrogram_augmentations.SNR_noise
      snr: 10.0
      noise_type: Gaussian
      p: 1.0
      generator_seed: 0
test_augmentation:
  _target_: autrainer.augmentations.augmentation_pipeline.AugmentationPipeline
  id: GaussianNoise(-5dB)
  pipeline:
  - SNR_noise:
      _target_: autrainer.augmentations.spectrogram_augmentations.SNR_noise
      snr: -5.0
      noise_type: StaticGaussian
      p: 1.0
      generator_seed: 0
