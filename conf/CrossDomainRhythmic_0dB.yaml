defaults:
- _autrainer_
- _self_

device: cuda
results_dir: results
experiment_id: cross_domain_rhythmic
iterations: 15

# Test augmentation - apply rhythmic noise during testing
test_augmentation:
  _target_: autrainer.augmentations.augmentation_pipeline.AugmentationPipeline
  id: CrossDomainRhythmic(0dB)
  pipeline:
  - CrossDomainNoise:
      _target_: autrainer.augmentations.spectrogram_augmentations.CrossDomainNoise
      noise_dir: autrainer-configurations/data/AudioSet-Balanced-Rhythmic
      noise_csv: autrainer-configurations/data/AudioSet-Balanced-Rhythmic/test.csv
      snr_db: 0.0
      sample_rate: 16000
      n_fft: 512
      hop_length: 160
      n_mels: 64
      noise_type: null  # Use all noise types (Bell, Cymbal, Drum, Clapping)
      p: 1.0
      generator_seed: 0

# Train augmentation - apply rhythmic noise during training
train_augmentation:
  _target_: autrainer.augmentations.augmentation_pipeline.AugmentationPipeline
  id: CrossDomainRhythmic(0dB)
  pipeline:
  - CrossDomainNoise:
      _target_: autrainer.augmentations.spectrogram_augmentations.CrossDomainNoise
      noise_dir: autrainer-configurations/data/AudioSet-Balanced-Rhythmic
      noise_csv: autrainer-configurations/data/AudioSet-Balanced-Rhythmic/train.csv
      snr_db: 0.0
      sample_rate: 16000
      n_fft: 512
      hop_length: 160
      n_mels: 64
      noise_type: null  # Use all noise types (Bell, Cymbal, Drum, Clapping)
      p: 1.0
      generator_seed: 0

hydra:
  sweeper:
    params:
      +seed: 0
      +batch_size: 64
      +learning_rate: 0.001
      dataset: TIMIT-sentencetype-16k
      model: Cnn10-32k-T
      optimizer: Adam
