test_augmentation:
  _target_: autrainer.augmentations.augmentation_pipeline.AugmentationPipeline
  id: GaussianNoise(H)
  pipeline: [
            {
              "GaussianNoise": {
              _target_: autrainer.augmentations.spectrogram_augmentations.StaticGaussianNoise,
              mean: 0.0,
              std: 0.5224,
              generator_seed: 0,
              p: 1.0},
              }
            ]



hydra:
  sweeper:
    params:
      +seed: 0
      +batch_size: 64
      +learning_rate: 0.001
      # dataset: TIMIT-dialect-16k, TIMIT-gender-16k, TIMIT-sentencetype-16k
      dataset: TIMIT-sentencetype-16k
      model: Cnn10-32k-T
      optimizer: Adam