defaults:
- _autrainer_
- _self_
device: cuda
results_dir: /mimer/NOBACKUP/groups/ulio_inverse/zhiping/data/results
experiment_id: GG_train40_test20
iterations: 15
precision: 16
num_workers: 8

hydra:
  sweeper:
    params:
      +seed: 0
      +batch_size: 256
      +learning_rate: 0.001
      dataset: SpeechCommands-16k
      model: Cnn10
      optimizer: Adam


train_augmentation:
  _target_: autrainer.augmentations.augmentation_pipeline.AugmentationPipeline
  id: GaussianNoise(40dB)
  pipeline:
  - SNR_noise:
      _target_: autrainer.augmentations.spectrogram_augmentations.SNR_noise
      snr: 40
      noise_type: StaticGaussian
      p: 1.0
      generator_seed: 0


test_augmentation:
  _target_: autrainer.augmentations.augmentation_pipeline.AugmentationPipeline
  id: GaussianNoise(20dB)
  pipeline:
  - SNR_noise:
      _target_: autrainer.augmentations.spectrogram_augmentations.SNR_noise
      snr: 20
      noise_type: StaticGaussian
      p: 1.0
      generator_seed: 0
