results_dir: results/preprocessing
dataset:
  id: SpeechCommands-preprocess
  _target_: autrainer.datasets.SpeechCommands
  path: autrainer-configurations/data/SpeechCommands/speech_commands_v0.02/speech_commands_v0.02
  features_subdir: default
  file_type: wav
  file_handler: autrainer.datasets.utils.AudioFileHandler
  index_column: path
  target_column: label
  criterion: autrainer.criterions.BalancedCrossEntropyLoss
  metrics:
  - autrainer.metrics.Accuracy
  - autrainer.metrics.UAR
  - autrainer.metrics.F1
  tracking_metric: autrainer.metrics.Accuracy
  transform:
    type: raw
preprocessing:
  file_handler:
    autrainer.datasets.utils.AudioFileHandler:
      target_sample_rate: 16000
  pipeline:
  - autrainer.transforms.StereoToMono
  - autrainer.transforms.PannMel:
      sample_rate: 16000
      window_size: 512
      hop_size: 160
      mel_bins: 64
      fmin: 50
      fmax: 8000
      ref: 1.0
      amin: 1.0e-10
      top_db: null
