results_dir: autrainer-configurations/data/SpeechCommands
dataset:
  id: SpeechCommands-16k
  _target_: autrainer.datasets.SpeechCommands
  path: autrainer-configurations/data/SpeechCommands
  features_subdir: log_mel_16k
  index_column: path
  target_column: label
  file_type: npy
  file_handler: autrainer.datasets.utils.NumpyFileHandler
  criterion: autrainer.criterions.BalancedCrossEntropyLoss
  metrics:
  - autrainer.metrics.Accuracy
  - autrainer.metrics.UAR
  - autrainer.metrics.F1
  tracking_metric: autrainer.metrics.Accuracy
  transform:
    type: grayscale
    base:
    - autrainer.transforms.Expand:
        size: 101
        axis: -2
preprocessing:
  file_handler:
    autrainer.datasets.utils.AudioFileHandler:
      target_sample_rate: 16000
  pipeline:
  - autrainer.transforms.StereoToMono
  - autrainer.transforms.PannMel:
      sample_rate: 16000
      window_size: 512
      hop_size: 160
      mel_bins: 64
      fmin: 50
      fmax: 8000
      ref: 1.0
      amin: 1.0e-10
      top_db: null
